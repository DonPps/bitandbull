<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bit &amp; Bull Studio – Authorization</title>
<style>:root{--bg:#14213d;--fg:#f5efe0;--acc:#9be15d}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}h1{color:var(--acc)}code{display:block;word-break:break-all;background:#0a1224;padding:12px;border-radius:8px}
button{margin-top:12px;background:var(--acc);border:0;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer}</style></head>
<body><main><h1>Authorization received</h1>
<p id="msg">Copy the code below and paste it into <b>C:\StudioAuto\.secret\tiktok_code.txt</b>, then tell Claude.</p>
<code id="code">—</code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy</button>
<script>
const q=new URLSearchParams(location.search);const c=q.get('code');const e=q.get('error_description')||q.get('error');
document.getElementById('code').textContent=c||('Error: '+(e||'no code'));
</script></main></body></html>
